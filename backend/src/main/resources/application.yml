server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: social-things-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:socialthings;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-in-production-use-32-chars-min}
    expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://socialthngs.com,https://www.socialthngs.com,https://social-things.onrender.com}
  tracker:
    url: ${TRACKER_DATABASE_URL:}
    username: ${TRACKER_DATABASE_USERNAME:}
    password: ${TRACKER_DATABASE_PASSWORD:}
    public-base-url: ${TRACKER_PUBLIC_BASE_URL:}
  storefront:
    url: ${STOREFRONT_URL:http://localhost:5173}
  api:
    public-url: ${PUBLIC_API_URL:${RENDER_EXTERNAL_URL:}}
  brevo:
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:contact@socialthngs.com}
    sender-name: ${BREVO_SENDER_NAME:SOCIAL THINGS}
    template-welcome: ${BREVO_TEMPLATE_WELCOME:0}
    template-order: ${BREVO_TEMPLATE_ORDER:0}
    template-newsletter: ${BREVO_TEMPLATE_NEWSLETTER:0}
    newsletter-list-id: ${BREVO_NEWSLETTER_LIST_ID:0}

logging:
  level:
    com.socialthings: INFO
