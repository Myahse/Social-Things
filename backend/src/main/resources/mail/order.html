<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SOCIAL THINGS</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f2f2f2">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background: #f2f2f2">
      <tr>
        <td align="center" style="padding: 48px 20px 56px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 440px">
            <tr>
              <td align="center" style="font-family: Arial, Helvetica, sans-serif">
                <img
                  src="{{LOGO_URL}}"
                  width="56"
                  height="56"
                  alt="SOCIAL THINGS"
                  style="display: block; margin: 0 auto 22px; border: 0"
                />
                <span
                  style="
                    display: inline-block;
                    background: #0a0a0a;
                    color: #fff;
                    padding: 6px 11px;
                    font-size: 10px;
                    letter-spacing: 0.22em;
                    box-shadow: 4px 4px 0 #0a0a0a;
                  "
                  >LOCKED IN</span
                >
                <p style="margin: 18px 0 0; font-size: 11px; letter-spacing: 0.3em; color: #0a0a0a">SOCIAL THINGS</p>
                <h1
                  style="
                    margin: 16px 0 0;
                    display: inline-block;
                    background: #0a0a0a;
                    color: #fff;
                    padding: 8px 14px;
                    font-size: 26px;
                    line-height: 1.1;
                    letter-spacing: 0.04em;
                    font-weight: normal;
                    box-shadow: 6px 6px 0 #fff;
                  "
                >
                  Order confirmed
                </h1>
                <p style="margin: 18px auto 0; max-width: 360px; font-size: 14px; line-height: 1.6; color: #666666">
                  {{GREETING}}Your order is saved and stock was taken from the drop.
                </p>
                <p style="margin: 28px 0 8px; font-size: 11px; letter-spacing: 0.18em; color: #666666">
                  ORDER {{ORDER_ID}}
                </p>
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  style="margin: 0 0 18px; border-collapse: collapse; text-align: left"
                >
                  {{ITEMS}}
                </table>
                <p style="margin: 0 0 28px; font-size: 15px; color: #0a0a0a">Total <strong>${{TOTAL}}</strong></p>
                <table role="presentation" cellspacing="0" cellpadding="0" style="margin: 28px auto 0">
                  <tr>
                    <td style="background: #0a0a0a; border: 3px solid #0a0a0a; box-shadow: 5px 5px 0 #0a0a0a">
                      <a
                        href="{{ORDER_URL}}"
                        style="
                          display: inline-block;
                          padding: 12px 22px;
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 12px;
                          letter-spacing: 0.18em;
                          text-transform: uppercase;
                          text-decoration: none;
                          color: #ffffff;
                        "
                        >View order</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
